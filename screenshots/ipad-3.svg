  <circle cx="727" cy="935" r="14" fill="url(#pegI3)"/>
  <circle cx="1322" cy="935" r="14" fill="url(#pegI3)"/>
  <circle cx="1619" cy="1450" r="14" fill="url(#pegI3)"/>
