  <circle cx="1024" cy="1450" r="117" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none"/>
  <circle cx="1024" cy="1450" r="65" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="1024" cy="1450" r="10" fill="#333"/>
  <circle cx="1024" cy="1450" r="545" fill="url(#specI3)"/>

