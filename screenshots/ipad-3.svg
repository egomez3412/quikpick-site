  <text x="1024" y="2498" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="52" font-weight="600" fill="rgba(255,255,255,0.3)" text-anchor="middle" dominant-baseline="middle">Options</text>

  <!-- Dark overlay -->
  <rect width="2048" height="2732" fill="rgba(0,0,0,0.48)"/>

  <!-- Alert dialog (centered, 1100×580) -->
  <g filter="url(#alertI3)">
    <rect x="474" y="1140" width="1100" height="580" rx="52" fill="#F2F2F7"/>
  </g>
  <text x="1024" y="1272" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="72" font-weight="700" fill="#1C1C1E" text-anchor="middle">Pizza!</text>
  <text x="1024" y="1360" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="48" fill="#3C3C43" text-anchor="middle">The wheel has decided!</text>
  <line x1="474" y1="1420" x2="1574" y2="1420" stroke="rgba(60,60,67,0.29)" stroke-width="2"/>
  <text x="1024" y="1512" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="50" fill="#007AFF" text-anchor="middle">Remove &amp; Spin Again</text>
