  <g filter="url(#sparkI3)" fill="white">
    <path d="M 888,908 L 893,923 L 908,928 L 893,933 L 888,948 L 883,933 L 868,928 L 883,923 Z" opacity="0.9"/>
    <path d="M 1148,900 L 1152,912 L 1164,916 L 1152,920 L 1148,932 L 1144,920 L 1132,916 L 1144,912 Z" opacity="0.85"/>
    <path d="M 1024,862 L 1028,873 L 1039,877 L 1028,881 L 1024,892 L 1020,881 L 1009,877 L 1020,873 Z" opacity="0.8"/>
