  <text x="1197" y="1350" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="72" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" transform="rotate(60,1197,1350)">Sushi</text>
  <text x="1197" y="1550" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="72" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60,1197,1550)">Tacos</text>
  <text x="1024" y="1650" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="65" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle">Burgers</text>
  <text x="851" y="1550" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="72" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" transform="rotate(60,851,1550)">Pasta</text>
  <text x="851" y="1350" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="72" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60,851,1350)">Salad</text>

