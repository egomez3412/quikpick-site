  <rect x="1934" y="1688" width="18" height="9" rx="3" fill="#FA9EA4" transform="rotate(50,1943,1692)"/>
  <rect x="196" y="1862" width="16" height="7" rx="2" fill="#FA6A7A" transform="rotate(25,204,1865)"/>
  <rect x="1820" y="1842" width="14" height="7" rx="2" fill="#F7BA5E" transform="rotate(-20,1827,1845)"/>
