  <path d="M 1824 82 Q 1835 71 1846 82" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="1835" cy="88" r="5" fill="white"/>
  <rect x="1874" y="44" width="66" height="32" rx="8" stroke="white" stroke-width="3.5" fill="none"/>
