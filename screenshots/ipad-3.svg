<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2732" viewBox="0 0 2048 2732">
  <defs>
    <linearGradient id="bgI3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141929"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <radialGradient id="chromeI3" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D8D8E0"/>
      <stop offset="40%" stop-color="#9090A0"/>
      <stop offset="70%" stop-color="#C8C8D0"/>
      <stop offset="100%" stop-color="#6A6A78"/>
    </radialGradient>
    <radialGradient id="hubI3" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F8F8FA"/>
      <stop offset="50%" stop-color="#C0C0C8"/>
      <stop offset="100%" stop-color="#707078"/>
    </radialGradient>
    <linearGradient id="ptrI3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C8C94"/>
      <stop offset="50%" stop-color="#515158"/>
      <stop offset="100%" stop-color="#242428"/>
    </linearGradient>
    <radialGradient id="specI3" cx="35%" cy="18%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="pegI3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8C8C8C"/>
    </radialGradient>
    <filter id="winGlowI3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="alertI3">
      <feDropShadow dx="0" dy="28" stdDeviation="50" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="sparkI3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2048" height="2732" fill="url(#bgI3)"/>

  <!-- iPad status bar -->
  <text x="100" y="88" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="52" font-weight="600" fill="white">9:41</text>
  <rect x="1742" y="52" width="9" height="20" rx="3" fill="white"/>
  <rect x="1757" y="45" width="9" height="27" rx="3" fill="white"/>
  <rect x="1772" y="37" width="9" height="35" rx="3" fill="white"/>
  <rect x="1787" y="30" width="9" height="42" rx="3" fill="white"/>
