  <path d="M 1024,1450 L 749,974 A 550,550 0 0,1 1299,974 Z" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="28" filter="url(#winGlowI3)"/>
  <path d="M 1024,1450 L 749,974 A 550,550 0 0,1 1299,974 Z" fill="rgba(255,255,255,0.15)"/>

