  <rect x="198" y="918" width="10" height="5" rx="2" fill="#F7BA5E" transform="rotate(-20,203,920)"/>
  <rect x="312" y="798" width="12" height="6" rx="2" fill="#69CAA6" transform="rotate(55,318,801)"/>
  <rect x="952" y="798" width="16" height="7" rx="2" fill="#F7BA5E" transform="rotate(30,960,802)"/>
  <rect x="1082" y="858" width="10" height="5" rx="2" fill="#69CAA6" transform="rotate(-25,1087,860)"/>
  <rect x="1158" y="920" width="14" height="6" rx="2" fill="#6999CA" transform="rotate(45,1165,923)"/>
  <rect x="78" y="1048" width="12" height="5" rx="2" fill="#B58FDB" transform="rotate(-30,84,1050)"/>
  <rect x="178" y="1100" width="16" height="7" rx="2" fill="#FA9EA4" transform="rotate(60,186,1103)"/>
  <rect x="1092" y="1040" width="10" height="5" rx="2" fill="#FA6A7A" transform="rotate(-45,1097,1042)"/>
  <rect x="1162" y="1098" width="14" height="6" rx="2" fill="#F7BA5E" transform="rotate(20,1169,1101)"/>
  <rect x="98" y="1280" width="12" height="5" rx="2" fill="#69CAA6" transform="rotate(40,104,1282)"/>
  <rect x="1152" y="1278" width="16" height="6" rx="2" fill="#6999CA" transform="rotate(-35,1160,1281)"/>
  <rect x="68" y="1448" width="10" height="5" rx="2" fill="#B58FDB" transform="rotate(-60,73,1450)"/>
  <rect x="1172" y="1450" width="14" height="7" rx="2" fill="#FA9EA4" transform="rotate(50,1179,1453)"/>
  <rect x="118" y="1600" width="12" height="5" rx="2" fill="#FA6A7A" transform="rotate(25,124,1602)"/>
  <rect x="1102" y="1578" width="10" height="5" rx="2" fill="#F7BA5E" transform="rotate(-20,1107,1580)"/>
  <rect x="198" y="1720" width="16" height="6" rx="2" fill="#69CAA6" transform="rotate(65,206,1723)"/>
  <rect x="1052" y="1700" width="12" height="5" rx="2" fill="#6999CA" transform="rotate(-50,1058,1702)"/>
  <circle cx="455" cy="836" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="788" cy="812" r="4" fill="#FA6A7A" opacity="0.9"/>
  <circle cx="280" cy="1702" r="5" fill="#B58FDB"/>
  <circle cx="952" cy="1732" r="4" fill="#FA9EA4"/>
  <rect x="482" y="798" width="8" height="4" rx="2" fill="#FA6A7A" transform="rotate(55,486,800)"/>
  <rect x="762" y="1700" width="10" height="4" rx="2" fill="#F7BA5E" transform="rotate(-40,767,1702)"/>
  <rect x="632" y="788" width="14" height="6" rx="2" fill="#B58FDB" transform="rotate(20,639,791)"/>
  <rect x="402" y="1722" width="8" height="4" rx="2" fill="#69CAA6" transform="rotate(-65,406,1724)"/>

  <!-- Options button (dimmed through overlay) -->
  <rect x="471" y="2272" width="300" height="70" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="621" y="2316" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="44" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" dominant-baseline="middle">Options</text>

  <!-- Dark overlay -->
  <rect width="1242" height="2688" fill="rgba(0,0,0,0.48)"/>

  <!-- iOS Alert dialog -->
  <g filter="url(#alertShadow)">
    <rect x="171" y="1040" width="900" height="500" rx="42" fill="#F2F2F7"/>
  </g>
  <!-- Alert title -->
  <text x="621" y="1160" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="60" font-weight="700" fill="#1C1C1E" text-anchor="middle">Pizza!</text>
  <!-- Alert message -->
  <text x="621" y="1240" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="40" fill="#3C3C43" text-anchor="middle">The wheel has decided!</text>
  <!-- Separator -->
  <line x1="171" y1="1300" x2="1071" y2="1300" stroke="rgba(60,60,67,0.29)" stroke-width="1.5"/>
  <!-- Button 1: Remove & Spin Again -->
  <text x="621" y="1385" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="42" fill="#007AFF" text-anchor="middle">Remove &amp; Spin Again</text>
  <!-- Separator -->
  <line x1="171" y1="1440" x2="1071" y2="1440" stroke="rgba(60,60,67,0.29)" stroke-width="1.5"/>
  <!-- Button 2: OK -->
  <text x="621" y="1510" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="48" font-weight="700" fill="#007AFF" text-anchor="middle">OK</text>

  <!-- Home indicator (visible over overlay) -->
  <rect x="471" y="2628" width="300" height="10" rx="5" fill="rgba(255,255,255,0.3)"/>
</svg>
