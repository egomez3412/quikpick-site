<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141929"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <radialGradient id="chromeRing3" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D8D8E0"/>
      <stop offset="40%" stop-color="#9090A0"/>
      <stop offset="70%" stop-color="#C8C8D0"/>
      <stop offset="100%" stop-color="#6A6A78"/>
    </radialGradient>
    <radialGradient id="hubGrad3" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F8F8FA"/>
      <stop offset="50%" stop-color="#C0C0C8"/>
      <stop offset="100%" stop-color="#707078"/>
    </radialGradient>
    <linearGradient id="pointerGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C8C94"/>
      <stop offset="50%" stop-color="#515158"/>
      <stop offset="100%" stop-color="#242428"/>
    </linearGradient>
    <radialGradient id="specular3" cx="35%" cy="18%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="pegGrad3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8C8C8C"/>
    </radialGradient>
    <filter id="winGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="alertShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1242" height="2688" fill="url(#bg3)"/>

  <!-- Status bar -->
  <rect x="481" y="14" width="280" height="38" rx="19" fill="#000000"/>
  <text x="90" y="72" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="46" font-weight="600" fill="white">9:41</text>
  <rect x="1050" y="44" width="8" height="18" rx="3" fill="white"/>
  <rect x="1064" y="38" width="8" height="24" rx="3" fill="white"/>
  <rect x="1078" y="31" width="8" height="31" rx="3" fill="white"/>
  <rect x="1092" y="24" width="8" height="38" rx="3" fill="white"/>
  <path d="M 1122 66 Q 1138 50 1154 66" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 1128 73 Q 1138 63 1148 73" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="1138" cy="78" r="4" fill="white"/>
  <rect x="1167" y="38" width="58" height="28" rx="7" stroke="white" stroke-width="3" fill="none"/>
  <rect x="1225" y="46" width="6" height="12" rx="2" fill="white" opacity="0.5"/>
  <rect x="1171" y="42" width="46" height="20" rx="4" fill="white" opacity="0.85"/>

  <!-- Wheel shadow -->
  <ellipse cx="621" cy="1800" rx="476" ry="56" fill="rgba(0,0,0,0.35)"/>

  <!-- Wheel -->
  <circle cx="621" cy="1290" r="500" fill="#101018"/>
  <circle cx="621" cy="1290" r="483" fill="url(#chromeRing3)"/>
  <circle cx="621" cy="1290" r="445" fill="#0A0A12"/>

  <!-- Slice 0: Pizza Pink (WINNER - highlighted) -->
  <path d="M 621,1290 L 408.5,922 A 425,425 0 0,1 833.5,922 Z" fill="#FA6A7A"/>
  <!-- Winner glow overlay -->
  <path d="M 621,1290 L 408.5,922 A 425,425 0 0,1 833.5,922 Z" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="22" filter="url(#winGlow)"/>
  <path d="M 621,1290 L 408.5,922 A 425,425 0 0,1 833.5,922 Z" fill="rgba(255,255,255,0.15)"/>

  <!-- Other slices -->
  <path d="M 621,1290 L 833.5,922 A 425,425 0 0,1 1046,1290 Z" fill="#F7BA5E" opacity="0.7"/>
  <path d="M 621,1290 L 1046,1290 A 425,425 0 0,1 833.5,1658 Z" fill="#69CAA6" opacity="0.7"/>
  <path d="M 621,1290 L 833.5,1658 A 425,425 0 0,1 408.5,1658 Z" fill="#6999CA" opacity="0.7"/>
  <path d="M 621,1290 L 408.5,1658 A 425,425 0 0,1 196,1290 Z" fill="#B58FDB" opacity="0.7"/>
  <path d="M 621,1290 L 196,1290 A 425,425 0 0,1 408.5,922 Z" fill="#FA9EA4" opacity="0.7"/>

  <!-- Labels -->
  <text x="621" y="1148" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(0,621,1135)">Pizza</text>
  <text x="755" y="1213" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle" transform="rotate(60,755,1213)">Sushi</text>
  <text x="755" y="1367" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60,755,1367)">Tacos</text>
  <text x="621" y="1445" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="50" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle">Burgers</text>
  <text x="487" y="1367" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle" transform="rotate(60,487,1367)">Pasta</text>
  <text x="487" y="1213" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60,487,1213)">Salad</text>

  <!-- Pegs -->
  <circle cx="391" cy="882" r="11" fill="url(#pegGrad3)"/>
  <circle cx="851" cy="882" r="11" fill="url(#pegGrad3)"/>
  <circle cx="1081" cy="1290" r="11" fill="url(#pegGrad3)"/>
  <circle cx="851" cy="1698" r="11" fill="url(#pegGrad3)"/>
  <circle cx="391" cy="1698" r="11" fill="url(#pegGrad3)"/>
  <circle cx="161" cy="1290" r="11" fill="url(#pegGrad3)"/>

  <!-- Hub -->
  <circle cx="621" cy="1290" r="90" fill="url(#hubGrad3)"/>
  <circle cx="621" cy="1290" r="90" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none"/>
  <circle cx="621" cy="1290" r="50" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <circle cx="621" cy="1290" r="8" fill="#333"/>

  <!-- Specular -->
  <circle cx="621" cy="1290" r="420" fill="url(#specular3)"/>

  <!-- Pointer -->
  <path d="M 608,685 Q 583,685 583,707 L 583,754 L 621,812 L 659,754 L 659,707 Q 659,685 634,685 Z" fill="url(#pointerGrad3)" stroke="rgba(180,180,190,0.6)" stroke-width="1.5"/>

  <!-- Sparkles around winner (top slice area) -->
  <g filter="url(#sparkle)" fill="white">
    <path d="M 548,850 L 552,862 L 564,866 L 552,870 L 548,882 L 544,870 L 532,866 L 544,862 Z" opacity="0.9"/>
    <path d="M 694,835 L 697,844 L 706,847 L 697,850 L 694,859 L 691,850 L 682,847 L 691,844 Z" opacity="0.85"/>
    <path d="M 621,795 L 624,803 L 632,806 L 624,809 L 621,817 L 618,809 L 610,806 L 618,803 Z" opacity="0.8"/>
  </g>

